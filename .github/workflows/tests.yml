name: API contract tests
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'postman/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'postman/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
