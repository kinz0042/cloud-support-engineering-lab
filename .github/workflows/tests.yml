name: API contract tests
on:
  push:
    paths-ignore:
      - 'postman/**'
  pull_request:
    paths-ignore:
      - 'postman/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check EC2 bootstrap syntax
        run: bash -n cloud/aws-relaydesk/bootstrap.sh
      - name: Check relative documentation links
        run: python scripts/check_doc_links.py
      - run: python -m unittest discover -s tests -v
