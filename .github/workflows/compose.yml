name: Compose end-to-end
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'postman/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'postman/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Start the complete stack
        run: docker compose up --build -d
      - name: Verify API and asynchronous delivery
        run: python3 scripts/compose_smoke.py
      - name: Verify read-only API triage
        run: python3 scripts/triage.py --profile compose
      - name: Verify network diagnostics
        run: python3 scripts/network_smoke.py
      - name: Verify partner deduplication survives restart
        run: python3 scripts/partner_persistence_smoke.py
      - name: Verify webhook failure recovery
        run: python3 scripts/webhook_fault_smoke.py
      - name: Start and validate monitoring
        run: |
          docker compose --profile observability up -d prometheus
          docker compose --profile observability exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose --profile observability exec -T prometheus promtool test rules /etc/prometheus/alerts.test.yml
      - name: Verify exhausted delivery replay and audit
        run: python3 scripts/dead_letter_smoke.py --observe-alerts
      - name: Validate SQL performance drill
        run: docker compose exec -T db psql -v ON_ERROR_STOP=1 -U lab -d relaydesk < sql/slow_orders.sql
      - name: Verify database and stopped-worker alert recovery
        run: python3 scripts/monitoring_smoke.py
      - name: Capture diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100
      - name: Clean up disposable CI database
        if: always()
        run: docker compose --profile observability down -v


