name: Windows foundation checks
on:
  push:
    paths:
      - 'app/**'
      - 'linux/status_service.py'
      - 'tests/test_linux_service.py'
      - 'scripts/triage.py'
      - 'scripts/windows-check.ps1'
      - 'scripts/windows-foundation-smoke.ps1'
      - 'scripts/paginate_orders.py'
      - 'tests/test_pagination.py'
      - 'tests/test_paginate_orders.py'
      - 'tests/test_relay_api.py'
      - 'tests/test_http_request_body.py'
      - 'tests/test_oauth_gateway_pagination.py'
      - 'tests/test_triage.py'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'linux/status_service.py'
      - 'tests/test_linux_service.py'
      - 'scripts/triage.py'
      - 'scripts/windows-check.ps1'
      - 'scripts/windows-foundation-smoke.ps1'
      - 'scripts/paginate_orders.py'
      - 'tests/test_pagination.py'
      - 'tests/test_paginate_orders.py'
      - 'tests/test_relay_api.py'
      - 'tests/test_http_request_body.py'
      - 'tests/test_oauth_gateway_pagination.py'
      - 'tests/test_triage.py'
      - '.github/workflows/windows.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check PowerShell prerequisite script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/windows-check.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Run foundation triage tests
        run: python -m unittest discover -s tests -p test_triage.py -v
      - name: Reproduce first incident with Windows PowerShell and curl.exe
        shell: powershell
        run: .\scripts\windows-foundation-smoke.ps1
      - name: Check standalone status process behavior
        run: python -m unittest discover -s tests -p test_linux_service.py -v
      - name: Check pagination parsing
        run: python -m unittest discover -s tests -p test_pagination.py -v
      - name: Check the local pagination client
        run: python -m unittest discover -s tests -p test_paginate_orders.py -v
      - name: Check paginated API behavior
        run: python -m unittest discover -s tests -p test_relay_api.py -v
      - name: Check incomplete request body handling
        run: python -m unittest discover -s tests -p test_http_request_body.py -v
      - name: Check OAuth gateway pagination behavior
        run: python -m unittest discover -s tests -p test_oauth_gateway_pagination.py -v

